[package]
name = "hub75-framebuffer"
description = "DMA-friendly Framebuffer implementation for HUB75 LED matrix displays"
repository = "https://github.com/liebman/hub75-framebuffer"
documentation = "https://docs.rs/hub75-framebuffer"
keywords = ["led-matrix", "hub75", "embedded", "framebuffer"]
categories = ["embedded", "hardware-support", "no-std"]
edition = "2021"
version = "0.11.0"
readme = "README.md"
authors = ["liebman <liebman@zod.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "s"

[profile.release]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "s"

[dependencies]
bitfield = { version = "0.19.4" }
defmt = { version = "1.0.1", optional = true }
embed-doc-image = { version = "0.1.4", optional = true }
embedded-dma = "0.2.0"
embedded-graphics = { version = "0.8.2" }

[features]
default = []
skip-black-pixels = []
esp32-ordering = []
reverse-row-order = []
defmt = ["dep:defmt"]
doc-images = ["dep:embed-doc-image"]

invert-oe = [] # invert the output enable signal
lead-blank-1 = []
lead-blank-2 = []
lead-blank-4 = []
lead-blank-8 = []
lead-blank-16 = []
lead-blank-32 = []
trail-blank-1 = []
trail-blank-2 = []
trail-blank-4 = []
trail-blank-8 = []
trail-blank-16 = []
trail-blank-32 = []
inter-row-blank-4 = ["inter-row-blank"]
inter-row-blank-8 = ["inter-row-blank"]
inter-row-blank-16 = ["inter-row-blank"]
inter-row-blank-32 = ["inter-row-blank"]

# this is for the plain framebuffer only
tail-closes-latch = [] # add a tail word that closes the latch after the data is shifted in

# internal non-public features; these are not meant to be enabled directly by users
inter-row-blank = []

[dev-dependencies]
criterion = "0.6"

[lib]
bench = false

[[bench]]
name = "set_pixel_plain"
harness = false

[[bench]]
name = "set_pixel_latched"
harness = false

[[bench]]
name = "erase_plain"
harness = false

[[bench]]
name = "erase_latched"
harness = false

[[bench]]
name = "fill_rect_plain"
harness = false

[[bench]]
name = "fill_rect_latched"
harness = false

[[bench]]
name = "render_text_plain"
harness = false

[[bench]]
name = "render_text_latched"
harness = false

[package.metadata.docs.rs]
features = ["doc-images"]
