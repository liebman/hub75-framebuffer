name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""  # No features
          - "defmt"
          - "invert-oe"
          - "lead-blank-4,trail-blank-16"
          - "lead-blank-16,trail-blank-4"
          - "lead-blank-32,trail-blank-32"
          - "inter-row-blank-8"
          - "esp32-ordering"
          - "tail-closes-latch"
          - "esp32-ordering,tail-closes-latch"
          - "interstate75"
          - "interstate75,tail-closes-latch"
          - "interstate75,invert-oe"
          - "interstate75,inter-row-blank-8"
          - "interstate75,reverse-row-order"
          - "interstate75,lead-blank-4,trail-blank-16"
          - "interstate75,skip-black-pixels"
          - "skip-black-pixels"
          - "reverse-row-order"
          - "reverse-row-order,esp32-ordering"
          - "reverse-row-order,inter-row-blank-8,tail-closes-latch"
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Build
        run: cargo build --verbose --no-default-features --features "${{ matrix.features }}"
      
      - name: Run tests
        run: cargo test --verbose --no-default-features --features "${{ matrix.features }}"

  # Minimum supported Rust version. `core::cfg_select!` (used to select the
  # board bit layout in src/pinmap.rs) was stabilised in 1.95.
  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build (default layout)
        run: cargo build --verbose --no-default-features

      - name: Build (interstate75)
        run: cargo build --verbose --no-default-features --features interstate75

      - name: Run tests (interstate75)
        run: cargo test --verbose --no-default-features --features interstate75

  # Additional checks
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Run clippy
        run: cargo clippy -F defmt -- -D warnings

      - name: Run clippy (interstate75)
        run: cargo clippy --no-default-features -F interstate75 -- -D warnings

  # Formatting check
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Coverage analysis
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      
      - name: Generate coverage
        run: cargo llvm-cov --no-report test
      - name: Generate coverage report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: lcov.info
          fail-on-error: true
    